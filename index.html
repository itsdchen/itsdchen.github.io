<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TWAP Tracker</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif;
            background: #0f1419;
            min-height: 100vh;
            padding: 24px;
            color: #e7e9ea;
        }

        .container {
            max-width: 1280px;
            margin: 0 auto;
        }

        header {
            background: #16202a;
            padding: 24px 32px;
            border-radius: 12px;
            border: 1px solid #2f3940;
            margin-bottom: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 {
            color: #e7e9ea;
            font-size: 22px;
            font-weight: 600;
            letter-spacing: -0.02em;
        }

        .subtitle {
            color: #71767b;
            font-size: 14px;
            margin-top: 4px;
        }

        .last-update {
            color: #71767b;
            font-size: 13px;
            text-align: right;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
            gap: 16px;
            margin-bottom: 16px;
        }

        .stat-card {
            background: #16202a;
            padding: 20px 24px;
            border-radius: 12px;
            border: 1px solid #2f3940;
            transition: border-color 0.2s, background 0.2s;
        }

        .stat-card:hover {
            border-color: #3d4f5f;
            background: #1a2734;
        }

        .symbol {
            font-size: 20px;
            font-weight: 600;
            color: #e7e9ea;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid #2f3940;
            letter-spacing: -0.01em;
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
        }

        .stat-label {
            color: #71767b;
            font-size: 13px;
        }

        .stat-value {
            font-weight: 600;
            font-size: 14px;
            color: #e7e9ea;
        }

        .positive {
            color: #00c853;
        }

        .negative {
            color: #ff5252;
        }

        .neutral {
            color: #71767b;
        }

        .loading {
            text-align: center;
            padding: 60px;
            color: #71767b;
            font-size: 16px;
        }

        .error {
            background: rgba(255, 82, 82, 0.1);
            border: 1px solid rgba(255, 82, 82, 0.3);
            color: #ff5252;
            padding: 20px 24px;
            border-radius: 12px;
            margin: 20px 0;
        }

        .no-data {
            background: #16202a;
            padding: 48px;
            border-radius: 12px;
            border: 1px solid #2f3940;
            text-align: center;
            color: #71767b;
        }

        .no-data h2 {
            color: #e7e9ea;
            font-size: 18px;
            margin-bottom: 8px;
        }

        .user-list {
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid #2f3940;
        }

        .user-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            font-size: 13px;
        }

        .user-row:not(:last-child) {
            border-bottom: 1px solid rgba(47, 57, 64, 0.5);
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .user-side {
            font-size: 10px;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 4px;
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }

        .user-side.buy {
            background: rgba(0, 200, 83, 0.15);
            color: #00c853;
        }

        .user-side.sell {
            background: rgba(255, 82, 82, 0.15);
            color: #ff5252;
        }

        .user-ntl {
            font-weight: 500;
            color: #e7e9ea;
        }

        .ghost-link {
            color: #8b5cf6;
            text-decoration: none;
            font-size: 12px;
            padding: 4px 10px;
            border: 1px solid #8b5cf6;
            border-radius: 6px;
            transition: all 0.2s;
            font-weight: 500;
        }

        .ghost-link:hover {
            background: #8b5cf6;
            color: #fff;
        }

        .section-header {
            background: #16202a;
            padding: 20px 28px;
            border-radius: 12px;
            border: 1px solid #2f3940;
            margin-bottom: 16px;
            margin-top: 32px;
        }

        .section-header h2 {
            color: #f59e0b;
            margin-bottom: 4px;
            font-size: 18px;
            font-weight: 600;
        }

        .section-header .section-subtitle {
            color: #71767b;
            font-size: 13px;
        }

        .premium-card {
            background: #16202a;
            padding: 20px 24px;
            border-radius: 12px;
            border: 1px solid #2f3940;
            border-left: 3px solid #f59e0b;
        }

        .premium-card:hover {
            border-color: #3d4f5f;
            border-left-color: #f59e0b;
            background: #1a2734;
        }

        .premium-card .symbol {
            color: #f59e0b;
        }

        .premium-value {
            font-size: 22px;
            font-weight: 700;
        }

        .premium-details {
            font-size: 12px;
            color: #71767b;
            margin-top: 4px;
        }

        @media (max-width: 768px) {
            body {
                padding: 16px;
            }

            .stats-grid {
                grid-template-columns: 1fr;
            }

            header {
                flex-direction: column;
                align-items: flex-start;
                gap: 12px;
            }

            .last-update {
                text-align: left;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div>
                <h1>TWAP Tracker</h1>
                <p class="subtitle">Monitoring active TWAP orders on Hyperliquid</p>
            </div>
            <div class="last-update" id="lastUpdate">Loading...</div>
        </header>

        <div id="content">
            <div class="loading">Loading TWAP data...</div>
        </div>

        <div id="weekendPremiums"></div>
    </div>

    <script>
        let refreshInterval;

        function formatNumber(num) {
            if (Math.abs(num) >= 1000000) {
                return (num / 1000000).toFixed(2) + 'M';
            } else if (Math.abs(num) >= 1000) {
                return (num / 1000).toFixed(2) + 'K';
            }
            return num.toFixed(2);
        }

        function getValueClass(value) {
            if (value > 0) return 'positive';
            if (value < 0) return 'negative';
            return 'neutral';
        }

        async function fetchData() {
            try {
                const response = await fetch('state.json?t=' + new Date().getTime());

                if (!response.ok) {
                    throw new Error('Failed to fetch data');
                }

                const rawData = await response.json();
                const normalized = normalizePayload(rawData);
                displayData(normalized.twapData);
                displayWeekendPremiums(normalized.weekendPremiums);
                updateLastUpdate(normalized.lastUpdated);

            } catch (error) {
                console.error('Error fetching data:', error);
                document.getElementById('content').innerHTML = `
                    <div class="error">
                        <strong>Error loading data:</strong> ${error.message}
                        <br><br>
                        Retrying in 30 seconds...
                    </div>
                `;
            }
        }

        function normalizePayload(payload) {
            if (!payload || typeof payload !== 'object') {
                return { twapData: null, lastUpdated: null, weekendPremiums: null };
            }

            if (payload.hasOwnProperty('twaps')) {
                return {
                    twapData: payload.twaps || {},
                    lastUpdated: payload.lastUpdated || null,
                    weekendPremiums: payload.weekendPremiums || null,
                };
            }

            // Backward compatibility: assume payload itself is the stats object.
            const { lastUpdated, weekendPremiums, _fridayCloseData, ...twapData } = payload;
            return {
                twapData: twapData,
                lastUpdated: lastUpdated || null,
                weekendPremiums: weekendPremiums || null,
            };
        }

        function displayData(data) {
            const content = document.getElementById('content');

            if (!data || Object.keys(data).length === 0) {
                content.innerHTML = `
                    <div class="no-data">
                        <h2>No Active TWAPs</h2>
                        <p>No TWAP orders are currently being tracked.</p>
                    </div>
                `;
                return;
            }

            let html = '<div class="stats-grid">';

            // Sort symbols by absolute notional value
            const sortedSymbols = Object.keys(data).sort((a, b) => {
                return Math.abs(data[b].netRemainingNtl) - Math.abs(data[a].netRemainingNtl);
            });

            for (const symbol of sortedSymbols) {
                const stats = data[symbol];
                const netNtl = stats.netRemainingNtl;
                const numTwaps = stats.numActiveTwaps;
                const direction = netNtl < 0 ? 'NET SELLING' : netNtl > 0 ? 'NET BUYING' : 'BALANCED';
                const directionClass = getValueClass(netNtl);

                const liquidity = stats.liquidity50bps;
                const twapPct = stats.twapPctOfLiquidity;
                const twapPctClass = twapPct >= 100 ? 'negative' : twapPct >= 50 ? 'neutral' : 'positive';

                // Build user list with ghost links
                const market = symbol.replace('xyz:', '');
                let usersHtml = '';
                if (stats.users && stats.users.length > 0) {
                    // Sort users by remaining notional (descending)
                    const sortedUsers = stats.users.sort((a, b) => b.remainingNtl - a.remainingNtl);
                    usersHtml = '<div class="user-list">';
                    for (const u of sortedUsers) {
                        const ghostUrl = `https://app.trade.xyz/?market=${market}&ghost=${u.user}&tab=twap`;
                        const shortAddr = u.user.slice(0, 6) + '...' + u.user.slice(-4);
                        const minsLeft = u.remainingMinutes ? ` (~${Math.round(u.remainingMinutes)}m)` : '';
                        usersHtml += `
                            <div class="user-row">
                                <div class="user-info">
                                    <span class="user-side ${u.side}">${u.side.toUpperCase()}</span>
                                    <span class="user-ntl">$${formatNumber(u.remainingNtl)}${minsLeft}</span>
                                </div>
                                <a href="${ghostUrl}" target="_blank" class="ghost-link" title="${u.user}">👻 ${shortAddr}</a>
                            </div>
                        `;
                    }
                    usersHtml += '</div>';
                }

                html += `
                    <div class="stat-card">
                        <div class="symbol">${market}</div>
                        <div class="stat-row">
                            <span class="stat-label">Active TWAPs</span>
                            <span class="stat-value">${numTwaps}</span>
                        </div>
                        <div class="stat-row">
                            <span class="stat-label">Net Remaining Notional</span>
                            <span class="stat-value ${directionClass}">$${formatNumber(netNtl)}</span>
                        </div>
                        <div class="stat-row">
                            <span class="stat-label">Direction</span>
                            <span class="stat-value ${directionClass}">${direction}</span>
                        </div>
                        ${liquidity ? `
                        <div class="stat-row">
                            <span class="stat-label">Liquidity (50bps)</span>
                            <span class="stat-value">$${formatNumber(liquidity)}</span>
                        </div>
                        ` : ''}
                        ${twapPct !== undefined ? `
                        <div class="stat-row">
                            <span class="stat-label">TWAP % of Liquidity</span>
                            <span class="stat-value ${twapPctClass}">${twapPct.toFixed(1)}%</span>
                        </div>
                        ` : ''}
                        ${usersHtml}
                    </div>
                `;
            }

            html += '</div>';
            content.innerHTML = html;
        }

        function formatPrice(num) {
            if (num >= 1000) {
                return num.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
            }
            return num.toFixed(4);
        }

        function formatPremium(pct) {
            const sign = pct >= 0 ? '+' : '';
            return sign + pct.toFixed(3) + '%';
        }

        function displayWeekendPremiums(data) {
            const container = document.getElementById('weekendPremiums');

            if (!data || !data.isWeekend || !data.symbols || Object.keys(data.symbols).length === 0) {
                container.innerHTML = '';
                return;
            }

            const fridayCloseDate = new Date(data.fridayCloseTime);
            const fridayCloseStr = fridayCloseDate.toLocaleString();

            let html = `
                <div class="section-header">
                    <h2>Weekend Oracle Premium</h2>
                    <p class="section-subtitle">HL Mark vs Friday Close (${fridayCloseStr} ET)</p>
                </div>
                <div class="stats-grid">
            `;

            // Sort by absolute premium
            const sortedSymbols = Object.keys(data.symbols).sort((a, b) => {
                return Math.abs(data.symbols[b].premiumPct) - Math.abs(data.symbols[a].premiumPct);
            });

            for (const symbol of sortedSymbols) {
                const info = data.symbols[symbol];
                const premiumClass = getValueClass(info.premiumPct);

                html += `
                    <div class="stat-card premium-card">
                        <div class="symbol">${symbol.replace('xyz:', '')}</div>
                        <div class="stat-row">
                            <span class="stat-label">Premium</span>
                            <span class="stat-value premium-value ${premiumClass}">${formatPremium(info.premiumPct)}</span>
                        </div>
                        <div class="stat-row">
                            <span class="stat-label">Current Mid</span>
                            <span class="stat-value">${formatPrice(info.currentMid)}</span>
                        </div>
                        <div class="stat-row">
                            <span class="stat-label">Friday Close</span>
                            <span class="stat-value">${formatPrice(info.fridayClose)}</span>
                        </div>
                    </div>
                `;
            }

            html += '</div>';
            container.innerHTML = html;
        }

        function updateLastUpdate(timestampString) {
            const lastUpdateNode = document.getElementById('lastUpdate');

            if (!timestampString) {
                lastUpdateNode.textContent = 'Last updated: Unknown';
                return;
            }

            const parsedDate = new Date(timestampString);

            if (isNaN(parsedDate.getTime())) {
                lastUpdateNode.textContent = `Last updated: ${timestampString}`;
                return;
            }

            lastUpdateNode.textContent = `Last updated: ${parsedDate.toLocaleDateString()} ${parsedDate.toLocaleTimeString()}`;
        }

        // Initial fetch
        fetchData();

        // Refresh every 30 seconds
        refreshInterval = setInterval(fetchData, 30000);
    </script>
</body>
</html>
