<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TWAP Tracker</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif;
            background: #0a0e12;
            min-height: 100vh;
            padding: 24px;
            color: #e7e9ea;
        }

        .container {
            max-width: 1280px;
            margin: 0 auto;
        }

        header {
            background: linear-gradient(135deg, #141c24 0%, #1a242f 100%);
            padding: 28px 32px;
            border-radius: 16px;
            border: 1px solid #2a3640;
            margin-bottom: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 {
            color: #e7e9ea;
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.03em;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        h1::before {
            content: '';
            display: inline-block;
            width: 8px;
            height: 24px;
            background: linear-gradient(180deg, #00c853 0%, #00a844 100%);
            border-radius: 4px;
        }

        .subtitle {
            color: #6b7280;
            font-size: 14px;
            margin-top: 6px;
        }

        .last-update {
            color: #6b7280;
            font-size: 13px;
            text-align: right;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .update-time {
            color: #9ca3af;
            font-weight: 500;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(400px, 1fr));
            gap: 16px;
            margin-bottom: 16px;
        }

        .stat-card {
            background: linear-gradient(145deg, #141c24 0%, #111920 100%);
            padding: 24px;
            border-radius: 16px;
            border: 1px solid #232d38;
            transition: all 0.25s ease;
            position: relative;
            overflow: hidden;
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, #2563eb 0%, #7c3aed 100%);
            opacity: 0;
            transition: opacity 0.25s ease;
        }

        .stat-card:hover {
            border-color: #3a4754;
            transform: translateY(-2px);
        }

        .stat-card:hover::before {
            opacity: 1;
        }

        .symbol {
            font-size: 22px;
            font-weight: 700;
            color: #f3f4f6;
            margin-bottom: 16px;
            padding-bottom: 14px;
            border-bottom: 1px solid #232d38;
            letter-spacing: -0.02em;
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
        }

        .stat-label {
            color: #6b7280;
            font-size: 13px;
            font-weight: 500;
        }

        .stat-value {
            font-weight: 600;
            font-size: 15px;
            color: #e7e9ea;
        }

        .positive {
            color: #22c55e;
        }

        .negative {
            color: #ef4444;
        }

        .neutral {
            color: #6b7280;
        }

        /* Direction badges */
        .direction-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
        }

        .direction-badge.buying {
            background: rgba(34, 197, 94, 0.12);
            color: #22c55e;
        }

        .direction-badge.selling {
            background: rgba(239, 68, 68, 0.12);
            color: #ef4444;
        }

        .direction-badge.balanced {
            background: rgba(107, 114, 128, 0.12);
            color: #6b7280;
        }

        /* Liquidity bar */
        .liquidity-bar {
            margin-top: 4px;
            height: 4px;
            background: #232d38;
            border-radius: 2px;
            overflow: hidden;
        }

        .liquidity-fill {
            height: 100%;
            border-radius: 2px;
            transition: width 0.3s ease;
        }

        .liquidity-fill.low {
            background: linear-gradient(90deg, #22c55e 0%, #16a34a 100%);
        }

        .liquidity-fill.medium {
            background: linear-gradient(90deg, #eab308 0%, #ca8a04 100%);
        }

        .liquidity-fill.high {
            background: linear-gradient(90deg, #ef4444 0%, #dc2626 100%);
        }

        .loading {
            text-align: center;
            padding: 80px;
            color: #6b7280;
            font-size: 16px;
        }

        .loading::after {
            content: '';
            display: block;
            width: 32px;
            height: 32px;
            margin: 16px auto 0;
            border: 3px solid #232d38;
            border-top-color: #2563eb;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .error {
            background: rgba(239, 68, 68, 0.08);
            border: 1px solid rgba(239, 68, 68, 0.2);
            color: #fca5a5;
            padding: 20px 24px;
            border-radius: 12px;
            margin: 20px 0;
        }

        .no-data {
            background: linear-gradient(145deg, #141c24 0%, #111920 100%);
            padding: 64px 48px;
            border-radius: 16px;
            border: 1px solid #232d38;
            text-align: center;
        }

        .no-data h2 {
            color: #e7e9ea;
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .no-data p {
            color: #6b7280;
        }

        .user-list {
            margin-top: 16px;
            padding-top: 14px;
            border-top: 1px solid #232d38;
        }

        .user-list-header {
            font-size: 11px;
            font-weight: 600;
            color: #4b5563;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 10px;
        }

        .user-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 12px;
            margin: 0 -12px;
            border-radius: 8px;
            font-size: 13px;
            transition: background 0.15s ease;
        }

        .user-row:hover {
            background: rgba(37, 99, 235, 0.06);
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .user-side {
            font-size: 10px;
            font-weight: 700;
            padding: 4px 8px;
            border-radius: 4px;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            min-width: 38px;
            text-align: center;
        }

        .user-side.buy {
            background: rgba(34, 197, 94, 0.15);
            color: #22c55e;
        }

        .user-side.sell {
            background: rgba(239, 68, 68, 0.15);
            color: #ef4444;
        }

        .user-ntl {
            font-weight: 600;
            color: #e7e9ea;
        }

        .user-time {
            color: #6b7280;
            font-weight: 400;
            font-size: 12px;
        }

        .ghost-link {
            color: #a78bfa;
            text-decoration: none;
            font-size: 12px;
            padding: 5px 12px;
            background: rgba(167, 139, 250, 0.1);
            border: 1px solid rgba(167, 139, 250, 0.25);
            border-radius: 6px;
            transition: all 0.2s ease;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .ghost-link:hover {
            background: rgba(167, 139, 250, 0.2);
            border-color: rgba(167, 139, 250, 0.4);
            color: #c4b5fd;
        }

        .section-header {
            background: linear-gradient(145deg, #141c24 0%, #111920 100%);
            padding: 20px 28px;
            border-radius: 12px;
            border: 1px solid #232d38;
            margin-bottom: 16px;
            margin-top: 40px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .section-header::before {
            content: '';
            display: block;
            width: 6px;
            height: 32px;
            background: linear-gradient(180deg, #38bdf8 0%, #0ea5e9 100%);
            border-radius: 3px;
        }

        .section-header h2 {
            color: #38bdf8;
            margin-bottom: 2px;
            font-size: 18px;
            font-weight: 600;
        }

        .section-header .section-subtitle {
            color: #6b7280;
            font-size: 13px;
        }

        .premium-card {
            background: linear-gradient(145deg, #141c24 0%, #111920 100%);
            padding: 20px 24px;
            border-radius: 12px;
            border: 1px solid #232d38;
            border-left: 3px solid #38bdf8;
            transition: all 0.25s ease;
        }

        .premium-card:hover {
            border-color: #3a4754;
            border-left-color: #38bdf8;
            transform: translateY(-2px);
        }

        .premium-card .symbol {
            color: #38bdf8;
        }

        .premium-value {
            font-size: 24px;
            font-weight: 700;
        }

        .premium-details {
            font-size: 12px;
            color: #6b7280;
            margin-top: 4px;
        }

        /* Market Stats Table */
        .mkt-stats-section {
            margin-top: 40px;
        }

        .mkt-stats-controls {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }

        .mkt-stats-btn {
            background: #141c24;
            border: 1px solid #2a3640;
            color: #9ca3af;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .mkt-stats-btn:hover {
            border-color: #3a4754;
            color: #e7e9ea;
        }

        .mkt-stats-btn.active {
            background: #1e293b;
            border-color: #38bdf8;
            color: #38bdf8;
        }

        .mkt-stats-table-wrap {
            overflow-x: auto;
            border-radius: 12px;
            border: 1px solid #232d38;
        }

        .mkt-stats-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
            white-space: nowrap;
        }

        .mkt-stats-table th {
            background: #141c24;
            color: #6b7280;
            font-weight: 600;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            padding: 10px 14px;
            text-align: right;
            border-bottom: 1px solid #232d38;
            position: sticky;
            top: 0;
            z-index: 1;
        }

        .mkt-stats-table th:first-child {
            text-align: left;
            position: sticky;
            left: 0;
            z-index: 2;
            background: #141c24;
        }

        .mkt-stats-table td {
            padding: 8px 14px;
            text-align: right;
            border-bottom: 1px solid #1a2230;
            color: #e7e9ea;
            font-variant-numeric: tabular-nums;
        }

        .mkt-stats-table td:first-child {
            text-align: left;
            font-weight: 600;
            color: #f3f4f6;
            position: sticky;
            left: 0;
            background: #0f1318;
            z-index: 1;
        }

        .mkt-stats-table tr:hover td {
            background: rgba(37, 99, 235, 0.04);
        }

        .mkt-stats-table tr:hover td:first-child {
            background: #151c24;
        }

        .mkt-stats-table td.no-data {
            color: #374151;
        }

        .mkt-stats-table .today-col {
            border-left: 2px solid #38bdf8;
        }

        /* Footer */
        footer {
            margin-top: 48px;
            padding: 20px;
            text-align: center;
            color: #4b5563;
            font-size: 12px;
        }

        footer a {
            color: #6b7280;
            text-decoration: none;
        }

        footer a:hover {
            color: #9ca3af;
        }

        @media (max-width: 768px) {
            body {
                padding: 16px;
            }

            .stats-grid {
                grid-template-columns: 1fr;
            }

            header {
                flex-direction: column;
                align-items: flex-start;
                gap: 16px;
            }

            .last-update {
                text-align: left;
            }

            .section-header {
                padding: 16px 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div>
                <h1>TWAP Tracker</h1>
                <p class="subtitle">Monitoring active TWAP orders on Hyperliquid</p>
            </div>
            <div class="last-update" id="lastUpdate">Loading...</div>
        </header>

        <div id="content">
            <div class="loading">Loading TWAP data</div>
        </div>

        <div id="weekendPremiums"></div>

        <div id="marketStats"></div>

        <footer>
            Auto-refreshes every 30s · Data from Hyperliquid
        </footer>
    </div>

    <script>
        let refreshInterval;

        function formatNumber(num) {
            if (Math.abs(num) >= 1000000) {
                return (num / 1000000).toFixed(2) + 'M';
            } else if (Math.abs(num) >= 1000) {
                return (num / 1000).toFixed(1) + 'K';
            }
            return num.toFixed(0);
        }

        function formatTime(minutes) {
            if (minutes >= 60) {
                const hours = Math.floor(minutes / 60);
                const mins = Math.round(minutes % 60);
                return mins > 0 ? `${hours}h ${mins}m` : `${hours}h`;
            }
            return `${Math.round(minutes)}m`;
        }

        function getValueClass(value) {
            if (value > 0) return 'positive';
            if (value < 0) return 'negative';
            return 'neutral';
        }

        async function fetchData() {
            try {
                const response = await fetch('state.json?t=' + new Date().getTime());

                if (!response.ok) {
                    throw new Error('Failed to fetch data');
                }

                const rawData = await response.json();
                const normalized = normalizePayload(rawData);
                displayData(normalized.twapData);
                displayWeekendPremiums(normalized.weekendPremiums);
                updateLastUpdate(normalized.lastUpdated);

            } catch (error) {
                console.error('Error fetching data:', error);
                document.getElementById('content').innerHTML = `
                    <div class="error">
                        <strong>Error loading data:</strong> ${error.message}
                        <br><br>
                        Retrying in 30 seconds...
                    </div>
                `;
            }
        }

        function normalizePayload(payload) {
            if (!payload || typeof payload !== 'object') {
                return { twapData: null, lastUpdated: null, weekendPremiums: null };
            }

            if (payload.hasOwnProperty('twaps')) {
                return {
                    twapData: payload.twaps || {},
                    lastUpdated: payload.lastUpdated || null,
                    weekendPremiums: payload.weekendPremiums || null,
                };
            }

            // Backward compatibility: assume payload itself is the stats object.
            const { lastUpdated, weekendPremiums, _fridayCloseData, ...twapData } = payload;
            return {
                twapData: twapData,
                lastUpdated: lastUpdated || null,
                weekendPremiums: weekendPremiums || null,
            };
        }

        function displayData(data) {
            const content = document.getElementById('content');

            if (!data || Object.keys(data).length === 0) {
                content.innerHTML = `
                    <div class="no-data">
                        <h2>No Active TWAPs</h2>
                        <p>No TWAP orders are currently being tracked.</p>
                    </div>
                `;
                return;
            }

            let html = '<div class="stats-grid">';

            // Sort symbols by absolute notional value
            const sortedSymbols = Object.keys(data).sort((a, b) => {
                return Math.abs(data[b].netRemainingNtl) - Math.abs(data[a].netRemainingNtl);
            });

            for (const symbol of sortedSymbols) {
                const stats = data[symbol];
                const netNtl = stats.netRemainingNtl;
                const numTwaps = stats.numActiveTwaps;
                const directionText = netNtl < 0 ? 'Selling' : netNtl > 0 ? 'Buying' : 'Balanced';
                const directionClass = netNtl < 0 ? 'selling' : netNtl > 0 ? 'buying' : 'balanced';
                const valueClass = getValueClass(netNtl);

                const liquidity = stats.liquidity50bps;
                const twapPct = stats.twapPctOfLiquidity;
                const twapPctClass = twapPct >= 100 ? 'negative' : twapPct >= 50 ? 'neutral' : 'positive';
                const liquidityBarClass = twapPct >= 100 ? 'high' : twapPct >= 50 ? 'medium' : 'low';
                const liquidityBarWidth = Math.min(twapPct || 0, 200) / 2; // Cap at 100% width

                // Build user list with ghost links
                const market = symbol.replace('xyz:', '');
                let usersHtml = '';
                if (stats.users && stats.users.length > 0) {
                    // Sort users by remaining notional (descending)
                    const sortedUsers = stats.users.sort((a, b) => b.remainingNtl - a.remainingNtl);
                    usersHtml = '<div class="user-list"><div class="user-list-header">Active Orders</div>';
                    for (const u of sortedUsers) {
                        const ghostUrl = `https://app.trade.xyz/?market=${market}&ghost=${u.user}&tab=twap`;
                        const shortAddr = u.user.slice(0, 6) + '...' + u.user.slice(-4);
                        const minsLeft = u.remainingMinutes ? `<span class="user-time">${formatTime(u.remainingMinutes)}</span>` : '';
                        usersHtml += `
                            <div class="user-row">
                                <div class="user-info">
                                    <span class="user-side ${u.side}">${u.side.toUpperCase()}</span>
                                    <span class="user-ntl">$${formatNumber(u.remainingNtl)}</span>
                                    ${minsLeft}
                                </div>
                                <a href="${ghostUrl}" target="_blank" class="ghost-link" title="${u.user}">👻 ${shortAddr}</a>
                            </div>
                        `;
                    }
                    usersHtml += '</div>';
                }

                html += `
                    <div class="stat-card">
                        <div class="symbol">${market}</div>
                        <div class="stat-row">
                            <span class="stat-label">Active TWAPs</span>
                            <span class="stat-value">${numTwaps}</span>
                        </div>
                        <div class="stat-row">
                            <span class="stat-label">Net Remaining</span>
                            <span class="stat-value ${valueClass}">$${formatNumber(Math.abs(netNtl))}</span>
                        </div>
                        <div class="stat-row">
                            <span class="stat-label">Direction</span>
                            <span class="direction-badge ${directionClass}">${directionText}</span>
                        </div>
                        ${liquidity ? `
                        <div class="stat-row">
                            <span class="stat-label">Book Liquidity (50bps)</span>
                            <span class="stat-value">$${formatNumber(liquidity)}</span>
                        </div>
                        ` : ''}
                        ${twapPct !== undefined ? `
                        <div class="stat-row">
                            <span class="stat-label">TWAP vs Liquidity</span>
                            <span class="stat-value ${twapPctClass}">${twapPct.toFixed(1)}%</span>
                        </div>
                        <div class="liquidity-bar">
                            <div class="liquidity-fill ${liquidityBarClass}" style="width: ${liquidityBarWidth}%"></div>
                        </div>
                        ` : ''}
                        ${usersHtml}
                    </div>
                `;
            }

            html += '</div>';
            content.innerHTML = html;
        }

        function formatPrice(num) {
            if (num >= 1000) {
                return num.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
            }
            return num.toFixed(4);
        }

        function formatPremium(pct) {
            const sign = pct >= 0 ? '+' : '';
            return sign + pct.toFixed(3) + '%';
        }

        function displayWeekendPremiums(data) {
            const container = document.getElementById('weekendPremiums');

            if (!data || !data.isWeekend || !data.symbols || Object.keys(data.symbols).length === 0) {
                container.innerHTML = '';
                return;
            }

            const fridayCloseDate = new Date(data.fridayCloseTime);
            const fridayCloseStr = fridayCloseDate.toLocaleString([], {
                month: 'short',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });

            let html = `
                <div class="section-header">
                    <div>
                        <h2>Weekend Premium</h2>
                        <p class="section-subtitle">Current price vs Friday close (${fridayCloseStr} ET)</p>
                    </div>
                </div>
                <div class="stats-grid">
            `;

            // Sort by absolute premium
            const sortedSymbols = Object.keys(data.symbols).sort((a, b) => {
                return Math.abs(data.symbols[b].premiumPct) - Math.abs(data.symbols[a].premiumPct);
            });

            for (const symbol of sortedSymbols) {
                const info = data.symbols[symbol];
                const premiumClass = getValueClass(info.premiumPct);

                html += `
                    <div class="stat-card premium-card">
                        <div class="symbol">${symbol.replace('xyz:', '')}</div>
                        <div class="stat-row">
                            <span class="stat-label">Premium</span>
                            <span class="stat-value premium-value ${premiumClass}">${formatPremium(info.premiumPct)}</span>
                        </div>
                        <div class="stat-row">
                            <span class="stat-label">Current Mid</span>
                            <span class="stat-value">${formatPrice(info.currentMid)}</span>
                        </div>
                        <div class="stat-row">
                            <span class="stat-label">Friday Close</span>
                            <span class="stat-value" style="color: #6b7280">${formatPrice(info.fridayClose)}</span>
                        </div>
                    </div>
                `;
            }

            html += '</div>';
            container.innerHTML = html;
        }

        function updateLastUpdate(timestampString) {
            const lastUpdateNode = document.getElementById('lastUpdate');

            if (!timestampString) {
                lastUpdateNode.innerHTML = '<span class="update-time">Unknown</span>';
                return;
            }

            const parsedDate = new Date(timestampString);

            if (isNaN(parsedDate.getTime())) {
                lastUpdateNode.innerHTML = `<span class="update-time">${timestampString}</span>`;
                return;
            }

            const timeStr = parsedDate.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            const dateStr = parsedDate.toLocaleDateString([], { month: 'short', day: 'numeric' });

            // Calculate how long ago
            const now = new Date();
            const diffMs = now - parsedDate;
            const diffMins = Math.floor(diffMs / 60000);
            let agoStr = '';
            if (diffMins < 1) {
                agoStr = 'just now';
            } else if (diffMins < 60) {
                agoStr = `${diffMins}m ago`;
            } else {
                agoStr = `${Math.floor(diffMins / 60)}h ago`;
            }

            lastUpdateNode.innerHTML = `
                <span class="update-time">${timeStr}</span>
                <span>${dateStr} · ${agoStr}</span>
            `;
        }

        // ---- Market Stats ----

        let currentMetric = 'volume_ntl';

        async function fetchMarketStats() {
            try {
                const resp = await fetch('market_stats.json?t=' + new Date().getTime());
                if (!resp.ok) return;
                const data = await resp.json();
                displayMarketStats(data);
            } catch (e) {
                console.error('Error fetching market stats:', e);
            }
        }

        function formatDateHeader(dateStr) {
            // "20260324" -> "3/24"
            const m = parseInt(dateStr.substring(4, 6), 10);
            const d = parseInt(dateStr.substring(6, 8), 10);
            return m + '/' + d;
        }

        function formatCellValue(val, metric) {
            if (val == null) return '';
            if (metric === 'volume_ntl') {
                if (val >= 1e9) return '$' + (val / 1e9).toFixed(1) + 'B';
                if (val >= 1e6) return '$' + (val / 1e6).toFixed(1) + 'M';
                if (val >= 1e3) return '$' + (val / 1e3).toFixed(0) + 'K';
                return '$' + val.toFixed(0);
            }
            if (metric === 'spread_bps') return val.toFixed(1);
            if (metric === 'daily_vol_pct') return val.toFixed(2) + '%';
            if (metric === 'num_trades') return val.toLocaleString();
            return val;
        }

        function getMetricValue(dayStats, metric) {
            if (!dayStats) return null;
            if (metric in dayStats) return dayStats[metric];
            return null;
        }

        function computeColorScale(allValues) {
            // Returns a function mapping value -> rgba background color
            if (allValues.length === 0) return () => '';
            const sorted = allValues.slice().sort((a, b) => a - b);
            const p10 = sorted[Math.floor(sorted.length * 0.1)] || sorted[0];
            const p90 = sorted[Math.floor(sorted.length * 0.9)] || sorted[sorted.length - 1];
            return function(val) {
                if (val == null) return '';
                const range = p90 - p10;
                if (range <= 0) return '';
                const t = Math.max(0, Math.min(1, (val - p10) / range));
                // Blue gradient: low = transparent, high = blue
                const alpha = (t * 0.35).toFixed(3);
                return `rgba(56, 189, 248, ${alpha})`;
            };
        }

        function computeSpreadColorScale(allValues) {
            // Spread: higher = worse, use orange/red tones
            if (allValues.length === 0) return () => '';
            const sorted = allValues.slice().sort((a, b) => a - b);
            const p10 = sorted[Math.floor(sorted.length * 0.1)] || sorted[0];
            const p90 = sorted[Math.floor(sorted.length * 0.9)] || sorted[sorted.length - 1];
            return function(val) {
                if (val == null) return '';
                const range = p90 - p10;
                if (range <= 0) return '';
                const t = Math.max(0, Math.min(1, (val - p10) / range));
                const alpha = (t * 0.35).toFixed(3);
                return `rgba(251, 146, 60, ${alpha})`;
            };
        }

        function displayMarketStats(data) {
            const container = document.getElementById('marketStats');
            if (!data || !data.symbols || !data.dates) {
                container.innerHTML = '';
                return;
            }

            const dates = data.dates;
            const symbols = data.symbols;
            const todayStr = dates[dates.length - 1];

            // Compute sort key: average volume over all days (descending)
            const symList = Object.keys(symbols);
            const symAvgVol = {};
            for (const sym of symList) {
                let total = 0, count = 0;
                for (const d of dates) {
                    const v = getMetricValue(symbols[sym][d], 'volume_ntl');
                    if (v != null) { total += v; count++; }
                }
                symAvgVol[sym] = count > 0 ? total / count : 0;
            }
            symList.sort((a, b) => symAvgVol[b] - symAvgVol[a]);

            // Gather all values for color scale
            const allVals = [];
            for (const sym of symList) {
                for (const d of dates) {
                    const v = getMetricValue(symbols[sym][d], currentMetric);
                    if (v != null) allVals.push(v);
                }
            }

            const colorFn = (currentMetric === 'spread_bps')
                ? computeSpreadColorScale(allVals)
                : computeColorScale(allVals);

            const metricLabel = {
                'volume_ntl': 'Volume (Notional)',
                'spread_bps': 'Spread (bps)',
                'daily_vol_pct': 'Volatility (%)',
                'num_trades': 'Num Trades',
            }[currentMetric] || currentMetric;

            let html = `
                <div class="section-header">
                    <div>
                        <h2>Market Stats</h2>
                        <p class="section-subtitle">10-day per-symbol stats · updated ${data.lastUpdated ? new Date(data.lastUpdated).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}) : '?'}</p>
                    </div>
                </div>
                <div class="mkt-stats-section">
                <div class="mkt-stats-controls">
                    <button class="mkt-stats-btn ${currentMetric === 'volume_ntl' ? 'active' : ''}" onclick="switchMetric('volume_ntl')">Volume</button>
                    <button class="mkt-stats-btn ${currentMetric === 'spread_bps' ? 'active' : ''}" onclick="switchMetric('spread_bps')">Spread</button>
                    <button class="mkt-stats-btn ${currentMetric === 'daily_vol_pct' ? 'active' : ''}" onclick="switchMetric('daily_vol_pct')">Volatility</button>
                    <button class="mkt-stats-btn ${currentMetric === 'num_trades' ? 'active' : ''}" onclick="switchMetric('num_trades')">Trades</button>
                </div>
                <div class="mkt-stats-table-wrap">
                <table class="mkt-stats-table">
                <thead><tr>
                    <th>Symbol</th>
            `;

            for (const d of dates) {
                const isToday = (d === todayStr);
                html += `<th class="${isToday ? 'today-col' : ''}">${formatDateHeader(d)}</th>`;
            }
            html += '</tr></thead><tbody>';

            for (const sym of symList) {
                const shortSym = sym.replace('xyz:', '');
                html += `<tr><td>${shortSym}</td>`;
                for (const d of dates) {
                    const isToday = (d === todayStr);
                    const val = getMetricValue(symbols[sym][d], currentMetric);
                    const bg = colorFn(val);
                    const style = bg ? `background:${bg}` : '';
                    const cls = (val == null ? 'no-data' : '') + (isToday ? ' today-col' : '');
                    html += `<td class="${cls}" style="${style}">${val != null ? formatCellValue(val, currentMetric) : '-'}</td>`;
                }
                html += '</tr>';
            }

            html += '</tbody></table></div></div>';
            container.innerHTML = html;
        }

        let _lastMarketStatsData = null;

        function switchMetric(metric) {
            currentMetric = metric;
            if (_lastMarketStatsData) {
                displayMarketStats(_lastMarketStatsData);
            } else {
                fetchMarketStats();
            }
        }

        // Wrap fetchMarketStats to cache data for metric switching
        const _origFetchMarketStats = fetchMarketStats;
        fetchMarketStats = async function() {
            try {
                const resp = await fetch('market_stats.json?t=' + new Date().getTime());
                if (!resp.ok) return;
                const data = await resp.json();
                _lastMarketStatsData = data;
                displayMarketStats(data);
            } catch (e) {
                console.error('Error fetching market stats:', e);
            }
        };

        // Initial fetch
        fetchData();
        fetchMarketStats();

        // Refresh every 30 seconds
        refreshInterval = setInterval(fetchData, 30000);
        setInterval(fetchMarketStats, 60000);
    </script>
</body>
</html>
