<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TWAP Tracker - Hyperliquid</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
        }

        h1 {
            color: #667eea;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #666;
            font-size: 14px;
        }

        .last-update {
            float: right;
            color: #888;
            font-size: 12px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
        }

        .symbol {
            font-size: 24px;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #f0f0f0;
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #f5f5f5;
        }

        .stat-row:last-child {
            border-bottom: none;
        }

        .stat-label {
            color: #666;
            font-size: 14px;
        }

        .stat-value {
            font-weight: bold;
            font-size: 16px;
        }

        .positive {
            color: #10b981;
        }

        .negative {
            color: #ef4444;
        }

        .neutral {
            color: #6b7280;
        }

        .loading {
            text-align: center;
            padding: 50px;
            color: white;
            font-size: 18px;
        }

        .error {
            background: #fee;
            color: #c33;
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
        }

        .no-data {
            background: white;
            padding: 40px;
            border-radius: 10px;
            text-align: center;
            color: #666;
        }

        .section-header {
            background: white;
            padding: 20px 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
            margin-top: 30px;
        }

        .section-header h2 {
            color: #f59e0b;
            margin-bottom: 5px;
            font-size: 20px;
        }

        .section-header .section-subtitle {
            color: #888;
            font-size: 13px;
        }

        .premium-card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            border-left: 4px solid #f59e0b;
        }

        .premium-card .symbol {
            color: #f59e0b;
        }

        .premium-value {
            font-size: 24px;
            font-weight: bold;
        }

        .premium-details {
            font-size: 12px;
            color: #888;
            margin-top: 5px;
        }

        @media (max-width: 768px) {
            .stats-grid {
                grid-template-columns: 1fr;
            }

            .last-update {
                float: none;
                display: block;
                margin-top: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Hyperliquid TWAP Tracker</h1>
            <p class="subtitle">Real-time monitoring of active TWAP orders</p>
            <div class="last-update" id="lastUpdate">Loading...</div>
        </header>

        <div id="content">
            <div class="loading">Loading TWAP data...</div>
        </div>

        <div id="weekendPremiums"></div>
    </div>

    <script>
        let refreshInterval;

        function formatNumber(num) {
            if (Math.abs(num) >= 1000000) {
                return (num / 1000000).toFixed(2) + 'M';
            } else if (Math.abs(num) >= 1000) {
                return (num / 1000).toFixed(2) + 'K';
            }
            return num.toFixed(2);
        }

        function getValueClass(value) {
            if (value > 0) return 'positive';
            if (value < 0) return 'negative';
            return 'neutral';
        }

        async function fetchData() {
            try {
                const response = await fetch('state.json?t=' + new Date().getTime());

                if (!response.ok) {
                    throw new Error('Failed to fetch data');
                }

                const rawData = await response.json();
                const normalized = normalizePayload(rawData);
                displayData(normalized.twapData);
                displayWeekendPremiums(normalized.weekendPremiums);
                updateLastUpdate(normalized.lastUpdated);

            } catch (error) {
                console.error('Error fetching data:', error);
                document.getElementById('content').innerHTML = `
                    <div class="error">
                        <strong>Error loading data:</strong> ${error.message}
                        <br><br>
                        Retrying in 30 seconds...
                    </div>
                `;
            }
        }

        function normalizePayload(payload) {
            if (!payload || typeof payload !== 'object') {
                return { twapData: null, lastUpdated: null, weekendPremiums: null };
            }

            if (payload.hasOwnProperty('twaps')) {
                return {
                    twapData: payload.twaps || {},
                    lastUpdated: payload.lastUpdated || null,
                    weekendPremiums: payload.weekendPremiums || null,
                };
            }

            // Backward compatibility: assume payload itself is the stats object.
            const { lastUpdated, weekendPremiums, _fridayCloseData, ...twapData } = payload;
            return {
                twapData: twapData,
                lastUpdated: lastUpdated || null,
                weekendPremiums: weekendPremiums || null,
            };
        }

        function displayData(data) {
            const content = document.getElementById('content');

            if (!data || Object.keys(data).length === 0) {
                content.innerHTML = `
                    <div class="no-data">
                        <h2>No Active TWAPs</h2>
                        <p>No TWAP orders are currently being tracked.</p>
                    </div>
                `;
                return;
            }

            let html = '<div class="stats-grid">';

            // Sort symbols by absolute notional value
            const sortedSymbols = Object.keys(data).sort((a, b) => {
                return Math.abs(data[b].netRemainingNtl) - Math.abs(data[a].netRemainingNtl);
            });

            for (const symbol of sortedSymbols) {
                const stats = data[symbol];
                const netNtl = stats.netRemainingNtl;
                const numTwaps = stats.numActiveTwaps;
                const direction = netNtl < 0 ? 'NET SELLING' : netNtl > 0 ? 'NET BUYING' : 'BALANCED';
                const directionClass = getValueClass(netNtl);

                html += `
                    <div class="stat-card">
                        <div class="symbol">${symbol.replace('xyz:', '')}</div>
                        <div class="stat-row">
                            <span class="stat-label">Active TWAPs</span>
                            <span class="stat-value">${numTwaps}</span>
                        </div>
                        <div class="stat-row">
                            <span class="stat-label">Net Remaining Notional</span>
                            <span class="stat-value ${directionClass}">$${formatNumber(netNtl)}</span>
                        </div>
                        <div class="stat-row">
                            <span class="stat-label">Direction</span>
                            <span class="stat-value ${directionClass}">${direction}</span>
                        </div>
                    </div>
                `;
            }

            html += '</div>';
            content.innerHTML = html;
        }

        function formatPrice(num) {
            if (num >= 1000) {
                return num.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
            }
            return num.toFixed(4);
        }

        function formatPremium(pct) {
            const sign = pct >= 0 ? '+' : '';
            return sign + pct.toFixed(3) + '%';
        }

        function displayWeekendPremiums(data) {
            const container = document.getElementById('weekendPremiums');

            if (!data || !data.isWeekend || !data.symbols || Object.keys(data.symbols).length === 0) {
                container.innerHTML = '';
                return;
            }

            const fridayCloseDate = new Date(data.fridayCloseTime);
            const fridayCloseStr = fridayCloseDate.toLocaleString();

            let html = `
                <div class="section-header">
                    <h2>Weekend Oracle Premium</h2>
                    <p class="section-subtitle">HL Mark vs Friday Close (${fridayCloseStr} ET)</p>
                </div>
                <div class="stats-grid">
            `;

            // Sort by absolute premium
            const sortedSymbols = Object.keys(data.symbols).sort((a, b) => {
                return Math.abs(data.symbols[b].premiumPct) - Math.abs(data.symbols[a].premiumPct);
            });

            for (const symbol of sortedSymbols) {
                const info = data.symbols[symbol];
                const premiumClass = getValueClass(info.premiumPct);

                html += `
                    <div class="stat-card premium-card">
                        <div class="symbol">${symbol.replace('xyz:', '')}</div>
                        <div class="stat-row">
                            <span class="stat-label">Premium</span>
                            <span class="stat-value premium-value ${premiumClass}">${formatPremium(info.premiumPct)}</span>
                        </div>
                        <div class="stat-row">
                            <span class="stat-label">Current Mid</span>
                            <span class="stat-value">${formatPrice(info.currentMid)}</span>
                        </div>
                        <div class="stat-row">
                            <span class="stat-label">Friday Close</span>
                            <span class="stat-value">${formatPrice(info.fridayClose)}</span>
                        </div>
                    </div>
                `;
            }

            html += '</div>';
            container.innerHTML = html;
        }

        function updateLastUpdate(timestampString) {
            const lastUpdateNode = document.getElementById('lastUpdate');

            if (!timestampString) {
                lastUpdateNode.textContent = 'Last updated: Unknown';
                return;
            }

            const parsedDate = new Date(timestampString);

            if (isNaN(parsedDate.getTime())) {
                lastUpdateNode.textContent = `Last updated: ${timestampString}`;
                return;
            }

            lastUpdateNode.textContent = `Last updated: ${parsedDate.toLocaleDateString()} ${parsedDate.toLocaleTimeString()}`;
        }

        // Initial fetch
        fetchData();

        // Refresh every 30 seconds
        refreshInterval = setInterval(fetchData, 30000);
    </script>
</body>
</html>
